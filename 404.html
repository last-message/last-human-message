<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Page Not Found — Last Human Message</title>

<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#070707">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#070707;
    color:#f4f1ea;
    font-family:Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
}

.container{
    width:min(650px,100%);
}

.code{
    font-size:clamp(90px,20vw,180px);
    font-weight:900;
    letter-spacing:-.08em;
    line-height:.8;
    color:#ef3038;
}

h1{
    margin-top:35px;
    font-size:clamp(30px,6vw,55px);
    letter-spacing:-.05em;
}

p{
    margin:22px auto 35px;
    max-width:500px;
    color:#777;
    line-height:1.8;
    font-size:15px;
}

a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:54px;
    padding:0 28px;
    background:#dc2028;
    color:#fff;
    text-decoration:none;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    transition:.25s;
}

a:hover{
    background:#ff3038;
    transform:translateY(-2px);
}

.small{
    margin-top:25px;
    font-size:9px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#444;
}
</style>
</head>

<body>

<main class="container">

<div class="code">404</div>

<h1>This message doesn't exist.</h1>

<p>
The page you're looking for may have disappeared,
but the human chain is still here.
</p>

<a href="/">
Return to Last Human Message
</a>

<div class="small">
One stranger. One message.
</div>

</main>

</body>
</html>
