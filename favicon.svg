<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4a52"/>
      <stop offset="100%" stop-color="#c9141d"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    width="100"
    height="100"
    rx="22"
    fill="url(#bg)"
  />

  <!-- Message bubble -->
  <path
    d="M23 25
       C23 19 28 15 35 15
       H65
       C72 15 77 20 77 27
       V55
       C77 62 72 67 65 67
       H48
       L35 82
       V67
       H35
       C28 67 23 62 23 55
       Z"
    fill="url(#red)"
    filter="url(#glow)"
  />

  <!-- Human connection dots -->
  <circle cx="38" cy="41" r="4" fill="#070707"/>
  <circle cx="50" cy="41" r="4" fill="#070707"/>
  <circle cx="62" cy="41" r="4" fill="#070707"/>

  <!-- Small connection line -->
  <path
    d="M38 52 H62"
    stroke="#070707"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".75"
  />
</svg>
